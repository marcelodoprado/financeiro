<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Cloud</title>
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- O seu Manifesto PWA -->
    <link rel="manifest" href="manifest.json">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- SDK do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .animar-entrada { animation: fadeInDown 0.5s ease-out forwards; }
        
        @media print {
            body { background-color: white !important; color: black !important; }
            .print-ocultar { display: none !important; }
            .text-white, .text-gray-400, .text-gray-200 { color: black !important; }
            .bg-gray-800, .bg-gray-900 { background-color: white !important; border: none !important; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #d1d5db !important; padding: 8px !important; }
            th { background-color: #e5e7eb !important; font-weight: bold !important; color: black !important; }
            tbody tr:nth-child(even) td { background-color: #f9fafb !important; }
            tbody tr:nth-child(odd) td { background-color: #ffffff !important; }
            #titulo-impressao { display: inline !important; }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen">

<!-- TELA DE LOGIN -->
<div id="tela-login" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50 transition-opacity duration-300">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm border border-gray-700">
        <h2 id="titulo-login" class="text-2xl font-bold text-white text-center mb-6">Acesso Seguro</h2>
        
        <form id="form-autenticacao" onsubmit="event.preventDefault();">
            <input type="email" id="email-login" autocomplete="username" placeholder="E-mail" class="w-full mb-4 bg-gray-900 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-blue-500">
            <input type="password" id="senha-login" autocomplete="current-password" placeholder="Senha" class="w-full mb-4 bg-gray-900 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-blue-500">
            
            <button type="submit" id="btn-entrar" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded transition-colors mb-4 shadow-lg">Entrar no Sistema</button>
        </form>
        
        <p id="msg-erro" class="text-red-400 text-sm text-center hidden mb-4">Ocorreu um erro. Tente novamente.</p>
        
        <div class="text-center mb-6">
            <button id="btn-alternar-registro" class="text-gray-400 hover:text-white text-sm transition-colors underline decoration-gray-600 underline-offset-4">Não tem conta? Registre-se</button>
        </div>
    </div>
</div>

<!-- APLICATIVO PRINCIPAL -->
<div id="app-principal" class="max-w-5xl mx-auto p-4 md:p-8 hidden">
    
    <header class="mb-6 flex flex-col md:flex-row justify-between items-center border-b border-gray-800 pb-4 gap-4 print:border-none print:pb-0">
        <div class="flex items-center gap-4 w-full md:w-auto justify-between">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-wide">FINANÇAS <span id="titulo-impressao" class="hidden text-lg font-normal ml-2"></span></h1>
                <div class="flex items-center gap-2 mt-1 print-ocultar">
                    <p id="usuario-logado" class="text-xs text-blue-400"></p>
                    <span class="text-gray-600 text-xs">|</span>
                    <p id="status-sincronizacao" class="text-xs font-bold text-yellow-500">Conectando Supabase...</p>
                </div>
            </div>
            <button id="btn-sair" class="text-xs uppercase bg-red-900/50 hover:bg-red-800 text-red-300 border border-red-800 px-3 py-1 rounded transition-colors print-ocultar">Sair</button>
        </div>
        
        <div class="flex items-center gap-3 print-ocultar flex-wrap justify-center">
            <button id="btn-voltar-hoje" class="text-gray-400 hover:text-white transition-colors p-2 bg-gray-800 border border-gray-700 rounded" title="Mês atual">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </button>
            <select id="filtro-mes" class="bg-gray-800 border border-gray-700 rounded p-2 text-white focus:outline-none text-sm font-medium">
                <option value="01">Janeiro</option> <option value="02">Fevereiro</option> <option value="03">Março</option> <option value="04">Abril</option>
                <option value="05">Maio</option> <option value="06">Junho</option> <option value="07">Julho</option> <option value="08">Agosto</option>
                <option value="09">Setembro</option> <option value="10">Outubro</option> <option value="11">Novembro</option> <option value="12">Dezembro</option>
            </select>
            <select id="filtro-ano" class="bg-gray-800 border border-gray-700 rounded p-2 text-white focus:outline-none text-sm font-medium"></select>
            <button onclick="window.print()" class="bg-gray-200 hover:bg-white text-gray-900 font-bold py-2 px-4 rounded text-sm">Gerar PDF</button>
        </div>
    </header>

    <div id="painel-sucesso" class="hidden animar-entrada bg-green-900/40 border border-green-500 text-green-300 p-4 rounded-lg mb-8 text-center print-ocultar">
        🎉 <strong>Mês Quitado!</strong> Excelente trabalho, você pagou todas as contas registradas!
    </div>

    <!-- Dashboard -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-gray-800 p-5 rounded-lg border border-gray-700"><h3 class="text-xs text-gray-400 uppercase mb-2">A Receber</h3><p id="dash-receber" class="text-xl font-bold text-white">R$ 0,00</p></div>
        <div class="bg-gray-800 p-5 rounded-lg border border-gray-700"><h3 class="text-xs text-gray-400 uppercase mb-2">A Pagar</h3><p id="dash-pagar" class="text-xl font-bold text-white">R$ 0,00</p></div>
        <div class="bg-gray-800 p-5 rounded-lg border border-gray-700"><h3 class="text-xs text-gray-400 uppercase mb-2">Recebido</h3><p id="dash-recebido" class="text-xl font-bold text-white">R$ 0,00</p></div>
        <div class="bg-gray-800 p-5 rounded-lg border border-gray-700"><h3 class="text-xs text-gray-400 uppercase mb-2">Saldo Mês</h3><p id="dash-saldo" class="text-xl font-bold text-white">R$ 0,00</p></div>
    </div>

    <!-- Formulário -->
    <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 mb-8 print-ocultar">
        <h2 id="titulo-formulario" class="text-lg font-medium text-white mb-4">Novo Lançamento</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-2"><label class="block text-xs text-gray-400 uppercase mb-1">Descrição</label><input type="text" id="desc" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"></div>
            <div><label class="block text-xs text-gray-400 uppercase mb-1">Tipo</label><select id="tipo" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"><option value="Pagar">Saída (-)</option><option value="Receber">Entrada (+)</option></select></div>
            <div><label class="block text-xs text-gray-400 uppercase mb-1">Status</label><select id="status" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"><option value="Pendente">Pendente</option><option value="Pago">Pago</option></select></div>
            <div><label class="block text-xs text-gray-400 uppercase mb-1">Data</label><input type="date" id="data" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"></div>
            <div><label class="block text-xs text-gray-400 uppercase mb-1">Valor (R$)</label><input type="number" id="valor" step="0.01" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"></div>
            <div id="box-repeticao"><label class="block text-xs text-gray-400 uppercase mb-1">Repetição</label><select id="repeticao" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"><option value="unico">Único</option><option value="mensal">Fixo (Até Dez)</option><option value="parcelado">Parcelado</option></select></div>
            <div id="box-parcelas" class="hidden"><label class="block text-xs text-gray-400 uppercase mb-1">Qtd. Parcelas</label><input type="number" id="qtd_parcelas" min="2" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"></div>
            <div class="md:col-span-4 flex justify-end gap-2 mt-2">
                <button id="btn-cancelar-edicao" class="hidden bg-gray-700 text-white py-2 px-4 rounded font-medium">Cancelar</button>
                <button id="btn-salvar" class="bg-gray-200 text-gray-900 font-bold py-2 px-6 rounded transition-colors hover:bg-white">Salvar na Nuvem</button>
            </div>
        </div>
    </div>

    <!-- Tabela -->
    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-x-auto mb-8">
        <table class="w-full text-sm text-left">
            <thead class="text-xs text-gray-400 uppercase bg-gray-900 border-b border-gray-700">
                <tr><th class="px-4 py-3">Data</th><th class="px-4 py-3">Descrição</th><th class="px-4 py-3">Tipo</th><th class="px-4 py-3">Valor</th><th class="px-4 py-3">Status</th><th class="px-4 py-3 text-right print-ocultar">Ações</th></tr>
            </thead>
            <tbody id="tabela-corpo" class="divide-y divide-gray-700"></tbody>
        </table>
    </div>
</div>

<script>
    // =======================================================
    // 1. INICIALIZAÇÃO DO SUPABASE (Sem Duplicidades)
    // =======================================================
    
    // Suas chaves já configuradas e corretas
    const supabaseUrl = 'https://kbsvasopeephsdkqidkm.supabase.co'; 
    const supabaseKey = 'sb_publishable_2ok-D1CZ-wigS-gCGPU0Aw_6IH4j94n';
    
    // Declarado uma ÚNICA vez para não travar a tela
    const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
    
    let bancoDeDados = [];
    let idEditando = null;
    let confeteJaDisparadoMeseAno = "";
    let currentUser = null;
    
    const telaLogin = document.getElementById('tela-login');
    const appPrincipal = document.getElementById('app-principal');
    const statusSync = document.getElementById('status-sincronizacao');
    const msgErro = document.getElementById('msg-erro');

    // =======================================================
    // 2. SISTEMA DE LOGIN E REGISTRO SUPABASE
    // =======================================================
    let modoRegistro = false;
    document.getElementById('btn-alternar-registro').addEventListener('click', () => {
        modoRegistro = !modoRegistro;
        document.getElementById('titulo-login').innerText = modoRegistro ? "Criar Nova Conta" : "Acesso Seguro";
        document.getElementById('btn-entrar').innerText = modoRegistro ? "Registrar-se" : "Entrar no Sistema";
        document.getElementById('btn-alternar-registro').innerText = modoRegistro ? "Já tem uma conta? Entre" : "Não tem conta? Registre-se";
        msgErro.classList.add('hidden');
    });

    document.getElementById('btn-entrar').addEventListener('click', async () => {
        const email = document.getElementById('email-login').value;
        const senha = document.getElementById('senha-login').value;
        msgErro.classList.add('hidden');
        
        try {
            let error = null;
            if (modoRegistro) {
                const result = await supabase.auth.signUp({ email, password: senha });
                error = result.error;
            } else {
                const result = await supabase.auth.signInWithPassword({ email, password: senha });
                error = result.error;
            }

            if (error) throw error;

        } catch (e) {
            msgErro.innerText = "Falha no acesso: Verifique e-mail e senha.";
            msgErro.classList.remove('hidden');
            console.error(e);
        }
    });

    document.getElementById('btn-sair').addEventListener('click', async () => {
        await supabase.auth.signOut();
    });

    supabase.auth.onAuthStateChange((event, session) => {
        if (session && session.user) {
            currentUser = session.user;
            telaLogin.classList.add('hidden');
            appPrincipal.classList.remove('hidden');
            document.getElementById('usuario-logado').innerText = currentUser.email;
            
            configurarFiltrosIniciais(); 
            carregarDadosDaNuvem(); 
        } else {
            currentUser = null;
            appPrincipal.classList.add('hidden');
            telaLogin.classList.remove('hidden');
            bancoDeDados = []; 
        }
    });

    // =======================================================
    // 3. COMUNICAÇÃO DE DADOS REST (Imbloqueável)
    // =======================================================
    async function carregarDadosDaNuvem() {
        if (!currentUser) return;
        statusSync.innerText = '🟡 Baixando Supabase...';
        statusSync.className = 'text-xs font-bold text-yellow-500';
        
        try {
            const { data, error } = await supabase
                .from('lancamentos')
                .select('*')
                .eq('user_id', currentUser.id); 
                
            if (error) throw error;
            
            bancoDeDados = data || [];
            statusSync.innerText = '🟢 Nuvem Atualizada';
            statusSync.className = 'text-xs font-bold text-green-500';
            atualizarTela();
            
        } catch (erro) {
            statusSync.innerText = '🔴 Erro de Rede';
            statusSync.className = 'text-xs font-bold text-red-500';
            console.error("Falha ao ler dados:", erro);
        }
    }

    document.getElementById('btn-salvar').addEventListener('click', async () => {
        if(!currentUser) return alert("Sua sessão expirou."); 
        
        const desc = document.getElementById('desc').value.trim();
        const tipo = document.getElementById('tipo').value;
        const status = document.getElementById('status').value;
        const data = document.getElementById('data').value;
        const valor = parseFloat(document.getElementById('valor').value);
        const repeticao = document.getElementById('repeticao').value;

        if (!desc || isNaN(valor) || !data) return alert("Preencha todos os campos obrigatórios.");

        statusSync.innerText = '🟡 Salvando Segurança Máxima...';
        statusSync.className = 'text-xs font-bold text-yellow-500';

        try {
            if (idEditando === null) {
                let limiteLoop = 1;
                const dataBase = new Date(data + 'T12:00:00'); 
                
                if (repeticao === 'mensal') limiteLoop = 12 - dataBase.getMonth();
                if (repeticao === 'parcelado') limiteLoop = parseInt(document.getElementById('qtd_parcelas').value) || 1;

                for (let i = 0; i < limiteLoop; i++) {
                    const novaData = new Date(dataBase);
                    novaData.setMonth(novaData.getMonth() + i);
                    let descFinal = repeticao === 'parcelado' ? `${desc} (${i + 1}/${limiteLoop})` : desc;
                    
                    const { error } = await supabase.from('lancamentos').insert([{ 
                        user_id: currentUser.id, desc: descFinal, tipo, status, data: novaData.toISOString().split('T')[0], valor 
                    }]);
                    if (error) throw error;
                }
            } else {
                const { error } = await supabase.from('lancamentos')
                    .update({ desc, tipo, status, data, valor })
                    .eq('id', idEditando)
                    .eq('user_id', currentUser.id); 
                if (error) throw error;
                cancelarEdicao();
            }
            
            limparFormulario();
            await carregarDadosDaNuvem();
            
        } catch (erro) {
            statusSync.innerText = '🔴 Erro ao Salvar';
            statusSync.className = 'text-xs font-bold text-red-500';
            alert(`Falha no banco de dados. Erro: ${erro.message}`);
        }
    });

    window.marcarConcluido = async function(id) {
        const lancamento = bancoDeDados.find(item => item.id === id);
        if (lancamento) {
            statusSync.innerText = '🟡 Atualizando...';
            const novoStatus = lancamento.tipo === 'Pagar' ? 'Pago' : 'Recebido';
            try {
                const { error } = await supabase.from('lancamentos')
                    .update({ status: novoStatus })
                    .eq('id', id).eq('user_id', currentUser.id);
                if (error) throw error;
                await carregarDadosDaNuvem();
            } catch(e) { alert("Erro de conexão."); }
        }
    };

    window.deletar = async function(id) {
        if (confirm("Deseja excluir definitivamente do Supabase?")) {
            statusSync.innerText = '🟡 Apagando...';
            try {
                const { error } = await supabase.from('lancamentos')
                    .delete()
                    .eq('id', id).eq('user_id', currentUser.id);
                if (error) throw error;
                await carregarDadosDaNuvem();
            } catch(e) { alert("Erro de conexão."); }
        }
    };

    // =======================================================
    // 4. LÓGICA DE INTERFACE E EVENTOS SECUNDÁRIOS
    // =======================================================
    document.getElementById('btn-cancelar-edicao').addEventListener('click', cancelarEdicao);
    document.getElementById('filtro-mes').addEventListener('change', atualizarTela);
    document.getElementById('filtro-ano').addEventListener('change', atualizarTela);
    document.getElementById('btn-voltar-hoje').addEventListener('click', voltarMesAtual);
    
    document.getElementById('tipo').addEventListener('change', () => {
        const tipo = document.getElementById('tipo').value;
        document.getElementById('status').innerHTML = tipo === 'Receber' 
            ? '<option value="Pendente">Pendente</option><option value="Recebido">Recebido</option>'
            : '<option value="Pendente">Pendente</option><option value="Pago">Pago</option>';
    });

    document.getElementById('repeticao').addEventListener('change', () => {
        const rep = document.getElementById('repeticao').value;
        document.getElementById('box-parcelas').classList.toggle('hidden', rep !== 'parcelado');
    });

    const nomeMeses = { "01": "Janeiro", "02": "Fevereiro", "03": "Março", "04": "Abril", "05": "Maio", "06": "Junho", "07": "Julho", "08": "Agosto", "09": "Setembro", "10": "Outubro", "11": "Novembro", "12": "Dezembro" };

    function configurarFiltrosIniciais() {
        const hoje = new Date();
        const selectAno = document.getElementById('filtro-ano');
        const selectMes = document.getElementById('filtro-mes');
        selectAno.innerHTML = ''; selectMes.innerHTML = '';
        
        for (let i = hoje.getFullYear() - 1; i <= hoje.getFullYear() + 4; i++) { selectAno.innerHTML += `<option value="${i}">${i}</option>`; }
        for (const [num, nome] of Object.entries(nomeMeses)) { selectMes.innerHTML += `<option value="${num}">${nome}</option>`; }
        voltarMesAtual(); 
    }

    function voltarMesAtual() {
        const hoje = new Date();
        document.getElementById('filtro-mes').value = String(hoje.getMonth() + 1).padStart(2, '0');
        document.getElementById('filtro-ano').value = hoje.getFullYear();
        document.getElementById('data').value = hoje.toISOString().split('T')[0];
        atualizarTela();
    }

    window.prepararEdicao = function(id) {
        const lancamento = bancoDeDados.find(item => item.id === id);
        if (!lancamento) return;
        document.getElementById('desc').value = lancamento.desc; 
        document.getElementById('tipo').value = lancamento.tipo;
        document.getElementById('tipo').dispatchEvent(new Event('change'));
        document.getElementById('status').value = lancamento.status;
        document.getElementById('data').value = lancamento.data; 
        document.getElementById('valor').value = lancamento.valor;
        document.getElementById('box-repeticao').classList.add('hidden'); 
        document.getElementById('box-parcelas').classList.add('hidden');
        idEditando = id;
        document.getElementById('titulo-formulario').innerText = "Editando Lançamento"; 
        document.getElementById('titulo-formulario').classList.add('text-yellow-500');
        document.getElementById('btn-salvar').innerText = "Atualizar Nuvem"; 
        document.getElementById('btn-cancelar-edicao').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function cancelarEdicao() {
        idEditando = null;
        document.getElementById('box-repeticao').classList.remove('hidden');
        document.getElementById('titulo-formulario').innerText = "Novo Lançamento"; 
        document.getElementById('titulo-formulario').classList.remove('text-yellow-500');
        document.getElementById('btn-salvar').innerText = "Salvar na Nuvem"; 
        document.getElementById('btn-cancelar-edicao').classList.add('hidden');
        limparFormulario();
    }

    function limparFormulario() {
        document.getElementById('desc').value = ''; 
        document.getElementById('valor').value = '';
        document.getElementById('repeticao').value = 'unico'; 
        document.getElementById('repeticao').dispatchEvent(new Event('change'));
    }

    function formatarData(dataISO) {
        if (!dataISO) return '-'; const partes = dataISO.split('-'); return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function atualizarTela() {
        const fMes = document.getElementById('filtro-mes').value; 
        const fAno = document.getElementById('filtro-ano').value;
        const corpoTabela = document.getElementById('tabela-corpo');
        corpoTabela.innerHTML = ''; 

        const dadosFiltrados = bancoDeDados.filter(conta => conta.data && conta.data.substring(0, 4) === fAno && conta.data.substring(5, 7) === fMes);
        dadosFiltrados.sort((a, b) => new Date(a.data) - new Date(b.data));

        let totReceber = 0, totPagar = 0, totRecebido = 0, totPago = 0;
        let qtdeContasPagar = 0, qtdeContasPagas = 0;

        dadosFiltrados.forEach((conta, index) => {
            if (conta.tipo === 'Receber' && conta.status === 'Pendente') totReceber += conta.valor;
            if (conta.tipo === 'Pagar' && conta.status === 'Pendente') totPagar += conta.valor;
            if (conta.status === 'Recebido') totRecebido += conta.valor;
            if (conta.status === 'Pago') totPago += conta.valor;

            if (conta.tipo === 'Pagar') { qtdeContasPagar++; if (conta.status === 'Pago') qtdeContasPagas++; }

            let badgeClass = "bg-gray-700 text-gray-300 border-gray-600"; 
            if (conta.status === 'Pago') badgeClass = "bg-green-900/50 text-green-400 border-green-800"; 
            if (conta.status === 'Recebido') badgeClass = "bg-yellow-900/50 text-yellow-400 border-yellow-800"; 

            let btnBaixa = conta.status === 'Pendente' ? `<button onclick="marcarConcluido('${conta.id}')" class="text-gray-400 hover:text-white px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs transition-colors mr-1">✔ Baixa</button>` : '';

            corpoTabela.innerHTML += `
                <tr class="hover:bg-gray-750 transition-colors ${index % 2 === 0 ? "bg-gray-800/30" : "bg-transparent"}">
                    <td class="px-4 py-3 whitespace-nowrap text-gray-400">${formatarData(conta.data)}</td>
                    <td class="px-4 py-3 font-medium text-gray-200">${conta.desc}</td>
                    <td class="px-4 py-3 text-gray-400">${conta.tipo === 'Pagar' ? 'Saída' : 'Entrada'}</td>
                    <td class="px-4 py-3 text-gray-200">R$ ${conta.valor.toFixed(2).replace('.', ',')}</td>
                    <td class="px-4 py-3"><span class="px-2 py-1 text-[10px] uppercase font-bold rounded border ${badgeClass}">${conta.status}</span></td>
                    <td class="px-4 py-3 text-right whitespace-nowrap print-ocultar">
                        ${btnBaixa}
                        <button onclick="prepararEdicao('${conta.id}')" class="text-blue-400 hover:text-blue-300 px-2 text-sm">Editar</button>
                        <button onclick="deletar('${conta.id}')" class="text-red-400 hover:text-red-300 px-2 text-sm">Excluir</button>
                    </td>
                </tr>`;
        });

        if (dadosFiltrados.length === 0) corpoTabela.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500">Nenhum lançamento encontrado neste mês.</td></tr>`;

        const painelSucesso = document.getElementById('painel-sucesso');
        const controleMesAno = `${fMes}-${fAno}`;
        if (qtdeContasPagar > 0 && qtdeContasPagar === qtdeContasPagas) {
            painelSucesso.classList.remove('hidden');
            if (confeteJaDisparadoMeseAno !== controleMesAno) { confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } }); confeteJaDisparadoMeseAno = controleMesAno; }
        } else { painelSucesso.classList.add('hidden'); }

        document.getElementById('dash-receber').innerText = `R$ ${totReceber.toFixed(2).replace('.', ',')}`; 
        document.getElementById('dash-pagar').innerText = `R$ ${totPagar.toFixed(2).replace('.', ',')}`;
        document.getElementById('dash-recebido').innerText = `R$ ${totRecebido.toFixed(2).replace('.', ',')}`;
        const saldoFinal = totRecebido - totPago;
        const saldoElemento = document.getElementById('dash-saldo');
        saldoElemento.innerText = `R$ ${saldoFinal.toFixed(2).replace('.', ',')}`;
        saldoElemento.className = saldoFinal < 0 ? "text-xl font-bold text-red-400" : "text-xl font-bold text-white";
    }
</script>
</body>
</html>
