<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Profissional</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Biblioteca de Confetes para a animação de sucesso -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        ::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }

        /* Animação suave para o banner de sucesso */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animar-entrada { animation: fadeInDown 0.5s ease-out forwards; }

        /* REGRAS DE IMPRESSÃO (PDF) */
        @media print {
            body { background-color: white !important; color: black !important; }
            .print-ocultar { display: none !important; }
            .text-white, .text-gray-400, .text-gray-200, .text-red-400 { color: black !important; }
            .bg-gray-800, .bg-gray-900 { background-color: white !important; border: none !important; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #d1d5db !important; padding: 8px !important; }
            th { background-color: #e5e7eb !important; font-weight: bold !important; color: black !important; }
            
            /* Zebrado forçado no PDF */
            tbody tr:nth-child(even) td { background-color: #f9fafb !important; }
            tbody tr:nth-child(odd) td { background-color: #ffffff !important; }
            
            #titulo-impressao { display: inline !important; }
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen p-4 md:p-8">

<div class="max-w-5xl mx-auto">
    
    <!-- Cabeçalho com Filtros e Botões -->
    <header class="mb-6 flex flex-col md:flex-row justify-between items-center border-b border-gray-800 pb-4 gap-4 print:border-none print:pb-0">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-bold text-white tracking-wide">
                CONTROLE FINANCEIRO 
                <span id="titulo-impressao" class="hidden text-lg font-normal ml-2"></span>
            </h1>
            <!-- Botões de Backup discretos ao lado do título -->
            <div class="flex gap-2 print-ocultar">
                <button onclick="exportarDados()" class="text-[10px] uppercase tracking-wider font-bold bg-gray-800 hover:bg-gray-700 text-gray-400 border border-gray-700 px-2 py-1 rounded transition-colors" title="Baixar arquivo de segurança">Exportar</button>
                <button onclick="document.getElementById('importFile').click()" class="text-[10px] uppercase tracking-wider font-bold bg-gray-800 hover:bg-gray-700 text-gray-400 border border-gray-700 px-2 py-1 rounded transition-colors" title="Restaurar de um arquivo">Importar</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importarDados(event)">
            </div>
        </div>
        
        <div class="flex items-center gap-3 print-ocultar flex-wrap justify-center">
            <!-- Botão Home (Ícone) -->
            <button onclick="voltarMesAtual()" class="text-gray-400 hover:text-white transition-colors p-2 bg-gray-800 border border-gray-700 rounded" title="Ir para o mês atual">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            </button>

            <select id="filtro-mes" onchange="atualizarTela()" class="bg-gray-800 border border-gray-700 rounded p-2 text-white focus:border-gray-500 focus:outline-none text-sm font-medium">
                <option value="01">Janeiro</option>
                <option value="02">Fevereiro</option>
                <option value="03">Março</option>
                <option value="04">Abril</option>
                <option value="05">Maio</option>
                <option value="06">Junho</option>
                <option value="07">Julho</option>
                <option value="08">Agosto</option>
                <option value="09">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
            </select>
            <select id="filtro-ano" onchange="atualizarTela()" class="bg-gray-800 border border-gray-700 rounded p-2 text-white focus:border-gray-500 focus:outline-none text-sm font-medium">
                <!-- Anos gerados pelo JavaScript -->
            </select>
            <button onclick="window.print()" class="bg-gray-200 hover:bg-white text-gray-900 font-bold py-2 px-4 rounded transition-colors text-sm">
                Gerar PDF
            </button>
        </div>
    </header>

    <!-- Banner de Sucesso (Gamificação) -->
    <div id="painel-sucesso" class="hidden animar-entrada bg-green-900/40 border border-green-500 text-green-300 p-4 rounded-lg mb-8 text-center print-ocultar">
        🎉 <strong>Mês Quitado!</strong> Excelente trabalho, você pagou todas as contas registradas para este mês!
    </div>

    <!-- Dashboard -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
        <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-sm">
            <h3 class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">A Receber</h3>
            <p id="dash-receber" class="text-xl font-semibold text-white">R$ 0,00</p>
        </div>
        <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-sm">
            <h3 class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">A Pagar</h3>
            <p id="dash-pagar" class="text-xl font-semibold text-white">R$ 0,00</p>
        </div>
        <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-sm">
            <h3 class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Recebido</h3>
            <p id="dash-recebido" class="text-xl font-semibold text-white">R$ 0,00</p>
        </div>
        <div class="bg-gray-800 p-5 rounded-lg border border-gray-700 shadow-sm">
            <h3 class="text-xs font-medium text-gray-400 uppercase tracking-wider mb-2">Saldo Mês</h3>
            <p id="dash-saldo" class="text-xl font-semibold text-white">R$ 0,00</p>
        </div>
    </div>

    <!-- Formulário (Oculto no PDF) -->
    <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 mb-8 print-ocultar shadow-sm">
        <h2 id="titulo-formulario" class="text-lg font-medium text-white mb-4">Novo Lançamento</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-2">
                <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Descrição</label>
                <input type="text" id="desc" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:border-gray-500 focus:outline-none" placeholder="Ex: Internet...">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Tipo</label>
                <select id="tipo" onchange="atualizarOpcoesStatus()" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:border-gray-500 focus:outline-none">
                    <option value="Pagar">Saída (-)</option>
                    <option value="Receber">Entrada (+)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Status</label>
                <select id="status" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:border-gray-500 focus:outline-none">
                    <option value="Pendente">Pendente</option>
                    <option value="Pago">Pago</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Data (Lançamento)</label>
                <input type="date" id="data" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:border-gray-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Valor (R$)</label>
                <input type="number" id="valor" step="0.01" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:border-gray-500 focus:outline-none" placeholder="0.00">
            </div>
            
            <!-- Controles de Repetição -->
            <div id="box-repeticao">
                <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Repetição</label>
                <select id="repeticao" onchange="mostrarOcultarParcelas()" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:border-gray-500 focus:outline-none">
                    <option value="unico">Único (Não repetir)</option>
                    <option value="mensal">Fixo (Até Dezembro)</option>
                    <option value="parcelado">Parcelado</option>
                </select>
            </div>
            <div id="box-parcelas" class="hidden">
                <label class="block text-xs font-medium text-gray-400 uppercase mb-1">Qtd. Parcelas</label>
                <input type="number" id="qtd_parcelas" min="2" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white focus:border-gray-500 focus:outline-none" placeholder="Ex: 10">
            </div>
            
            <!-- Botões do Form -->
            <div class="md:col-span-4 flex justify-end gap-2 mt-2">
                <button id="btn-cancelar-edicao" onclick="cancelarEdicao()" class="hidden bg-gray-700 text-white font-medium py-2 px-4 rounded hover:bg-gray-600 transition-colors">
                    Cancelar
                </button>
                <button id="btn-salvar" onclick="salvarLancamento()" class="bg-gray-200 text-gray-900 font-semibold py-2 px-6 rounded hover:bg-white transition-colors">
                    Salvar Lançamento
                </button>
            </div>
        </div>
    </div>

    <!-- Tabela de Lançamentos -->
    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-x-auto shadow-sm">
        <table class="w-full text-sm text-left">
            <thead class="text-xs text-gray-400 uppercase bg-gray-900 border-b border-gray-700">
                <tr>
                    <th class="px-4 py-3 font-medium">Data</th>
                    <th class="px-4 py-3 font-medium">Descrição</th>
                    <th class="px-4 py-3 font-medium">Tipo</th>
                    <th class="px-4 py-3 font-medium">Valor</th>
                    <th class="px-4 py-3 font-medium">Status</th>
                    <th class="px-4 py-3 font-medium text-right print-ocultar">Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo" class="divide-y divide-gray-700">
                <!-- Linhas injetadas pelo JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let bancoDeDados = JSON.parse(localStorage.getItem('ControleFinanceiroApp')) || [];
    let idEditando = null;
    let confeteJaDisparadoMeseAno = ""; // Memória para não disparar confete toda hora
    
    const nomeMeses = {
        "01": "Janeiro", "02": "Fevereiro", "03": "Março", "04": "Abril", 
        "05": "Maio", "06": "Junho", "07": "Julho", "08": "Agosto", 
        "09": "Setembro", "10": "Outubro", "11": "Novembro", "12": "Dezembro"
    };

    // --- Configurações Iniciais ---
    function configurarFiltrosIniciais() {
        const hoje = new Date();
        const anoAtual = hoje.getFullYear();
        
        const selectAno = document.getElementById('filtro-ano');
        selectAno.innerHTML = '';
        for (let i = anoAtual - 1; i <= anoAtual + 4; i++) {
            const option = document.createElement('option');
            option.value = i; option.text = i;
            selectAno.appendChild(option);
        }
        voltarMesAtual(); 
    }

    function voltarMesAtual() {
        const hoje = new Date();
        document.getElementById('filtro-mes').value = String(hoje.getMonth() + 1).padStart(2, '0');
        document.getElementById('filtro-ano').value = hoje.getFullYear();
        document.getElementById('data').value = hoje.toISOString().split('T')[0];
        atualizarTela();
    }

    // --- Lógica de Backup (Exportar / Importar) ---
    function exportarDados() {
        if (bancoDeDados.length === 0) {
            alert("Não há dados para exportar.");
            return;
        }
        // Converte o array para texto JSON
        const dataStr = JSON.stringify(bancoDeDados, null, 2);
        // Cria um "link" virtual para fazer o download
        const blob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        
        const dataHoje = new Date().toISOString().split('T')[0];
        link.href = url;
        link.download = `backup_financas_${dataHoje}.json`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function importarDados(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const dadosImportados = JSON.parse(e.target.result);
                if (Array.isArray(dadosImportados)) {
                    if(confirm("ATENÇÃO: Isso irá apagar os dados atuais da tela e substituí-r pelo backup. Deseja continuar?")) {
                        bancoDeDados = dadosImportados;
                        salvarNoNavegadorEAtualizar();
                        alert("Backup restaurado com sucesso!");
                    }
                } else {
                    alert("O arquivo não parece ser um backup válido.");
                }
            } catch (erro) {
                alert("Erro ao ler o arquivo. Certifique-se de que é um arquivo JSON válido.");
            }
            // Limpa o input para permitir importar o mesmo arquivo novamente se necessário
            document.getElementById('importFile').value = ''; 
        };
        reader.readAsText(file);
    }

    // --- Lógica do Formulário ---
    function atualizarOpcoesStatus() {
        const tipo = document.getElementById('tipo').value;
        const statusSelect = document.getElementById('status');
        if (tipo === 'Receber') {
            statusSelect.innerHTML = '<option value="Pendente">Pendente</option><option value="Recebido">Recebido</option>';
        } else {
            statusSelect.innerHTML = '<option value="Pendente">Pendente</option><option value="Pago">Pago</option>';
        }
    }

    function mostrarOcultarParcelas() {
        const rep = document.getElementById('repeticao').value;
        const boxParcelas = document.getElementById('box-parcelas');
        if (rep === 'parcelado') boxParcelas.classList.remove('hidden');
        else boxParcelas.classList.add('hidden');
    }

    function formatarData(dataISO) {
        if (!dataISO) return '-';
        const partes = dataISO.split('-');
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    // --- Salvamento ---
    function salvarLancamento() {
        const desc = document.getElementById('desc').value.trim();
        const tipo = document.getElementById('tipo').value;
        const status = document.getElementById('status').value;
        const data = document.getElementById('data').value;
        const valor = parseFloat(document.getElementById('valor').value);
        const repeticao = document.getElementById('repeticao').value;

        if (!desc || isNaN(valor) || valor <= 0 || !data) {
            alert("Preencha todos os campos obrigatórios corretamente.");
            return;
        }

        if (idEditando === null) {
            let limiteLoop = 1;
            const dataBase = new Date(data + 'T12:00:00'); 
            
            if (repeticao === 'mensal') {
                const mesInicial = dataBase.getMonth();
                limiteLoop = 12 - mesInicial; 
            }
            if (repeticao === 'parcelado') {
                limiteLoop = parseInt(document.getElementById('qtd_parcelas').value) || 1;
            }

            for (let i = 0; i < limiteLoop; i++) {
                const novaData = new Date(dataBase);
                novaData.setMonth(novaData.getMonth() + i);
                const dataStringFormatada = novaData.toISOString().split('T')[0];

                let descFinal = desc;
                if (repeticao === 'parcelado') descFinal = `${desc} (${i + 1}/${limiteLoop})`;

                bancoDeDados.push({
                    id: Date.now() + i,
                    desc: descFinal,
                    tipo: tipo,
                    data: dataStringFormatada,
                    valor: valor,
                    status: status
                });
            }
        } else {
            const index = bancoDeDados.findIndex(item => item.id === idEditando);
            if (index !== -1) {
                bancoDeDados[index].desc = desc;
                bancoDeDados[index].tipo = tipo;
                bancoDeDados[index].status = status;
                bancoDeDados[index].data = data;
                bancoDeDados[index].valor = valor;
            }
            cancelarEdicao();
        }

        salvarNoNavegadorEAtualizar();
        limparFormulario();
    }

    // --- Edição e Ações Rápidas ---
    function prepararEdicao(id) {
        const lancamento = bancoDeDados.find(item => item.id === id);
        if (!lancamento) return;

        document.getElementById('desc').value = lancamento.desc;
        document.getElementById('tipo').value = lancamento.tipo;
        atualizarOpcoesStatus();
        document.getElementById('status').value = lancamento.status;
        document.getElementById('data').value = lancamento.data;
        document.getElementById('valor').value = lancamento.valor;

        document.getElementById('box-repeticao').classList.add('hidden');
        document.getElementById('box-parcelas').classList.add('hidden');

        idEditando = id;
        document.getElementById('titulo-formulario').innerText = "Editando Lançamento";
        document.getElementById('titulo-formulario').classList.add('text-yellow-500');
        document.getElementById('btn-salvar').innerText = "Atualizar Lançamento";
        document.getElementById('btn-cancelar-edicao').classList.remove('hidden');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicao() {
        idEditando = null;
        document.getElementById('box-repeticao').classList.remove('hidden');
        document.getElementById('titulo-formulario').innerText = "Novo Lançamento";
        document.getElementById('titulo-formulario').classList.remove('text-yellow-500');
        document.getElementById('btn-salvar').innerText = "Salvar Lançamento";
        document.getElementById('btn-cancelar-edicao').classList.add('hidden');
        limparFormulario();
    }

    function marcarConcluido(id) {
        const index = bancoDeDados.findIndex(item => item.id === id);
        if (index !== -1) {
            const tipoConta = bancoDeDados[index].tipo;
            bancoDeDados[index].status = tipoConta === 'Pagar' ? 'Pago' : 'Recebido';
            salvarNoNavegadorEAtualizar();
        }
    }

    function deletar(id) {
        if (confirm("Deseja excluir definitivamente este lançamento?")) {
            bancoDeDados = bancoDeDados.filter(conta => conta.id !== id);
            salvarNoNavegadorEAtualizar();
        }
    }

    function limparFormulario() {
        document.getElementById('desc').value = '';
        document.getElementById('valor').value = '';
        document.getElementById('repeticao').value = 'unico';
        mostrarOcultarParcelas();
    }

    function salvarNoNavegadorEAtualizar() {
        localStorage.setItem('ControleFinanceiroApp', JSON.stringify(bancoDeDados));
        atualizarTela();
    }

    // --- Motor de Renderização Principal ---
    function atualizarTela() {
        const corpoTabela = document.getElementById('tabela-corpo');
        corpoTabela.innerHTML = ''; 

        const fMes = document.getElementById('filtro-mes').value;
        const fAno = document.getElementById('filtro-ano').value;
        const controleMesAno = `${fMes}-${fAno}`;
        
        document.getElementById('titulo-impressao').innerText = `- ${nomeMeses[fMes]} de ${fAno}`;

        const dadosFiltrados = bancoDeDados.filter(conta => {
            const anoConta = conta.data.substring(0, 4);
            const mesConta = conta.data.substring(5, 7);
            return (anoConta === fAno && mesConta === fMes);
        });

        dadosFiltrados.sort((a, b) => new Date(a.data) - new Date(b.data));

        let totReceber = 0, totPagar = 0, totRecebido = 0, totPago = 0;
        let qtdeContasPagar = 0;
        let qtdeContasPagas = 0;

        // Loop principal: processa os dados e desenha as linhas
        dadosFiltrados.forEach((conta, index) => {
            // Cálculos
            if (conta.tipo === 'Receber' && conta.status === 'Pendente') totReceber += conta.valor;
            if (conta.tipo === 'Pagar' && conta.status === 'Pendente') totPagar += conta.valor;
            if (conta.status === 'Recebido') totRecebido += conta.valor;
            if (conta.status === 'Pago') totPago += conta.valor;

            // Verificação para a animação de sucesso
            if (conta.tipo === 'Pagar') {
                qtdeContasPagar++;
                if (conta.status === 'Pago') qtdeContasPagas++;
            }

            // Design visual
            let badgeClass = "bg-gray-700 text-gray-300 border-gray-600"; 
            if (conta.status === 'Pago') badgeClass = "bg-green-900/50 text-green-400 border-green-800"; 
            if (conta.status === 'Recebido') badgeClass = "bg-yellow-900/50 text-yellow-400 border-yellow-800"; 

            let btnBaixa = '';
            if (conta.status === 'Pendente') {
                btnBaixa = `<button onclick="marcarConcluido(${conta.id})" class="text-gray-400 hover:text-white px-2 py-1 bg-gray-700 hover:bg-gray-600 rounded text-xs transition-colors mr-1">✔ Baixa</button>`;
            }

            // MAGIA DO ZEBRADO: Calculado diretamente no JavaScript para garantir 100% de funcionamento
            const corZebrada = index % 2 === 0 ? "bg-gray-800/30" : "bg-transparent";

            const tr = document.createElement('tr');
            tr.className = `hover:bg-gray-750 transition-colors ${corZebrada}`;
            tr.innerHTML = `
                <td class="px-4 py-3 whitespace-nowrap text-gray-400">${formatarData(conta.data)}</td>
                <td class="px-4 py-3 font-medium text-gray-200">${conta.desc}</td>
                <td class="px-4 py-3 text-gray-400">${conta.tipo === 'Pagar' ? 'Saída' : 'Entrada'}</td>
                <td class="px-4 py-3 text-gray-200">R$ ${conta.valor.toFixed(2).replace('.', ',')}</td>
                <td class="px-4 py-3">
                    <span class="px-2 py-1 text-[10px] uppercase font-bold rounded border ${badgeClass}">${conta.status}</span>
                </td>
                <td class="px-4 py-3 text-right whitespace-nowrap print-ocultar">
                    ${btnBaixa}
                    <button onclick="prepararEdicao(${conta.id})" class="text-blue-400 hover:text-blue-300 px-2 text-sm transition-colors">Editar</button>
                    <button onclick="deletar(${conta.id})" class="text-red-400 hover:text-red-300 px-2 text-sm transition-colors">Excluir</button>
                </td>
            `;
            corpoTabela.appendChild(tr);
        });

        if (dadosFiltrados.length === 0) {
            corpoTabela.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500">Nenhum lançamento encontrado.</td></tr>`;
        }

        // --- Disparo da Gamificação ---
        const painelSucesso = document.getElementById('painel-sucesso');
        if (qtdeContasPagar > 0 && qtdeContasPagar === qtdeContasPagas) {
            painelSucesso.classList.remove('hidden');
            // Dispara confete apenas 1x por mês para não ficar chato
            if (confeteJaDisparadoMeseAno !== controleMesAno) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                confeteJaDisparadoMeseAno = controleMesAno;
            }
        } else {
            painelSucesso.classList.add('hidden');
        }

        // Atualiza Valores do Dashboard
        document.getElementById('dash-receber').innerText = `R$ ${totReceber.toFixed(2).replace('.', ',')}`;
        document.getElementById('dash-pagar').innerText = `R$ ${totPagar.toFixed(2).replace('.', ',')}`;
        document.getElementById('dash-recebido').innerText = `R$ ${totRecebido.toFixed(2).replace('.', ',')}`;
        
        const saldoFinal = totRecebido - totPago;
        const saldoElemento = document.getElementById('dash-saldo');
        saldoElemento.innerText = `R$ ${saldoFinal.toFixed(2).replace('.', ',')}`;
        saldoElemento.className = saldoFinal < 0 ? "text-xl font-semibold text-red-400" : "text-xl font-semibold text-white";
    }

    window.onload = function() {
        configurarFiltrosIniciais(); 
    };
</script>

</html>
