<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro Cloud</title>
    <meta name="theme-color" content="#111827">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen">

<!-- TELA DE LOGIN -->
<div id="tela-login" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
    <div class="bg-gray-800 p-8 rounded-lg shadow-xl w-full max-w-sm border border-gray-700">
        <h2 id="titulo-login" class="text-2xl font-bold text-white text-center mb-6">Acesso Seguro</h2>
        <input type="email" id="email-login" placeholder="E-mail" class="w-full mb-4 bg-gray-900 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-blue-500">
        <input type="password" id="senha-login" placeholder="Senha" class="w-full mb-4 bg-gray-900 border border-gray-700 rounded p-3 text-white focus:outline-none focus:border-blue-500">
        <button id="btn-entrar" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded transition-colors mb-4">Entrar no Sistema</button>
        <p id="msg-erro" class="text-red-400 text-sm text-center hidden mb-4">Ocorreu um erro. Tente novamente.</p>
        <div class="text-center mb-6"><button id="btn-alternar-registro" class="text-gray-400 hover:text-white text-sm transition-colors underline">Não tem conta? Registre-se</button></div>
    </div>
</div>

<!-- APLICATIVO PRINCIPAL -->
<div id="app-principal" class="max-w-5xl mx-auto p-4 md:p-8 hidden">
    <header class="mb-6 flex justify-between items-center border-b border-gray-800 pb-4">
        <div>
            <h1 class="text-2xl font-bold text-white">FINANÇAS</h1>
            <div class="flex items-center gap-2 mt-1">
                <p id="usuario-logado" class="text-xs text-blue-400"></p>
                <span class="text-gray-600 text-xs">|</span>
                <p id="status-sincronizacao" class="text-xs font-bold text-yellow-500">Conectando Nuvem...</p>
            </div>
        </div>
        <button id="btn-sair" class="text-xs uppercase bg-red-900/50 hover:bg-red-800 text-red-300 border border-red-800 px-3 py-1 rounded">Sair</button>
    </header>

    <!-- Formulário -->
    <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 mb-8">
        <h2 id="titulo-formulario" class="text-lg font-medium text-white mb-4">Novo Lançamento</h2>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-2"><label class="block text-xs text-gray-400 uppercase mb-1">Descrição</label><input type="text" id="desc" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"></div>
            <div><label class="block text-xs text-gray-400 uppercase mb-1">Tipo</label><select id="tipo" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"><option value="Pagar">Saída (-)</option><option value="Receber">Entrada (+)</option></select></div>
            <div><label class="block text-xs text-gray-400 uppercase mb-1">Status</label><select id="status" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"><option value="Pendente">Pendente</option><option value="Pago">Pago</option></select></div>
            <div><label class="block text-xs text-gray-400 uppercase mb-1">Data</label><input type="date" id="data" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"></div>
            <div><label class="block text-xs text-gray-400 uppercase mb-1">Valor (R$)</label><input type="number" id="valor" step="0.01" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"></div>
            <div><label class="block text-xs text-gray-400 uppercase mb-1">Repetição</label><select id="repeticao" class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-white"><option value="unico">Único</option></select></div>
            <div class="md:col-span-4 flex justify-end mt-2">
                <button id="btn-salvar" class="bg-gray-200 text-gray-900 font-bold py-2 px-6 rounded transition-colors hover:bg-white">Salvar na Nuvem</button>
            </div>
        </div>
    </div>

    <!-- Tabela -->
    <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead class="text-xs text-gray-400 uppercase bg-gray-900 border-b border-gray-700">
                <tr><th class="px-4 py-3">Data</th><th class="px-4 py-3">Descrição</th><th class="px-4 py-3">Valor</th><th class="px-4 py-3">Status</th></tr>
            </thead>
            <tbody id="tabela-corpo" class="divide-y divide-gray-700"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { initializeFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBDP0CWYnv4LdpVxMykHMPVx3fsyavF8kw",
      authDomain: "financeiro-cd95f.firebaseapp.com",
      projectId: "financeiro-cd95f",
      storageBucket: "financeiro-cd95f.firebasestorage.app",
      messagingSenderId: "14408523133",
      appId: "1:14408523133:web:3d5c840411315dffcc8014"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // Modo de Força Bruta para Redes Bloqueadas
    const db = initializeFirestore(app, { experimentalForceLongPolling: true }); 
    
    let colLancamentos = null;
    
    const telaLogin = document.getElementById('tela-login');
    const appPrincipal = document.getElementById('app-principal');
    const statusSync = document.getElementById('status-sincronizacao');

    // ==========================================
    // O CRONÔMETRO BOMBA (TIMEOUT FORÇADO)
    // ==========================================
    document.getElementById('btn-salvar').addEventListener('click', async () => {
        const desc = document.getElementById('desc').value.trim();
        const data = document.getElementById('data').value;
        const valor = parseFloat(document.getElementById('valor').value);

        if (!desc || isNaN(valor) || !data) return alert("Preencha Descrição, Data e Valor.");

        statusSync.innerText = '🟡 Salvando na Nuvem...';
        
        try {
            const lancamentoInfo = { desc, tipo: document.getElementById('tipo').value, data, valor, status: document.getElementById('status').value };
            
            // Cria a ordem de salvamento normal
            const promessaSalvar = addDoc(colLancamentos, lancamentoInfo);
            
            // Cria um cronômetro de 5 segundos. Se estourar, ele corta a operação.
            const promessaTimeout = new Promise((resolve, reject) => {
                setTimeout(() => reject(new Error("TIMEOUT_REDE")), 5000);
            });

            // O código faz uma "corrida". Se o salvamento demorar mais de 5s, o Timeout vence e acusa o erro.
            await Promise.race([promessaSalvar, promessaTimeout]);

            statusSync.innerText = '🟢 Salvo com Sucesso';
            document.getElementById('desc').value = '';
            document.getElementById('valor').value = '';
            
        } catch (erro) {
            statusSync.innerText = '🔴 Erro de Rede';
            if(erro.message === "TIMEOUT_REDE") {
                alert("O Firebase está sendo bloqueado de acessar a internet pelo seu computador ou roteador e não consegue enviar os dados.\n\nPor favor, abra o Console apertando F12.");
            } else {
                alert(`Erro Técnico: ${erro.message}`);
            }
        }
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            telaLogin.classList.add('hidden');
            appPrincipal.classList.remove('hidden');
            document.getElementById('usuario-logado').innerText = user.email;
            
            colLancamentos = collection(db, "usuarios", user.uid, "lancamentos");
            iniciarEscuta();
        } else {
            appPrincipal.classList.add('hidden');
            telaLogin.classList.remove('hidden');
        }
    });

    document.getElementById('btn-entrar').addEventListener('click', () => {
        const email = document.getElementById('email-login').value;
        const senha = document.getElementById('senha-login').value;
        if(modoRegistro) createUserWithEmailAndPassword(auth, email, senha);
        else signInWithEmailAndPassword(auth, email, senha);
    });

    let modoRegistro = false;
    document.getElementById('btn-alternar-registro').addEventListener('click', () => {
        modoRegistro = !modoRegistro;
        document.getElementById('btn-entrar').innerText = modoRegistro ? "Registrar-se" : "Entrar no Sistema";
    });

    document.getElementById('btn-sair').addEventListener('click', () => signOut(auth));

    function iniciarEscuta() {
        onSnapshot(colLancamentos, (snapshot) => {
            const corpoTabela = document.getElementById('tabela-corpo');
            corpoTabela.innerHTML = '';
            statusSync.innerText = '🟢 Online e Atualizado';
            snapshot.forEach((docRef) => {
                const conta = docRef.data();
                corpoTabela.innerHTML += `<tr><td class="px-4 py-2">${conta.data}</td><td class="px-4 py-2">${conta.desc}</td><td class="px-4 py-2">R$ ${conta.valor}</td><td class="px-4 py-2">${conta.status}</td></tr>`;
            });
        }, (erro) => {
            statusSync.innerText = '🔴 Desconectado';
            console.error(erro);
        });
    }
</script>
</body>
</html>
